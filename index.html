<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shop Field Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding-bottom: 40px; }
    header { background: #1e293b; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 50; }
    h1 { font-size: 1.1rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .back-btn { background: #334155; color: #f8fafc; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: none; }
    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    
    /* Category Grid */
    .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .cat-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100px; }
    .cat-card:active { background: #334155; }
    .cat-icon { font-size: 2rem; margin-bottom: 8px; }
    .cat-title { font-size: 0.95rem; font-weight: 600; color: #f1f5f9; }

    /* Model Cards */
    .model-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .model-card:active { background: #334155; }
    .model-make { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: 700; }
    .model-name { font-size: 1.05rem; font-weight: 700; color: #f8fafc; margin-top: 2px; }

    /* Spec Hub */
    .spec-box { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
    .spec-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .diagram-btn { background: #0284c7; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .spec-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 0.85rem; }
    .spec-item { background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid #334155; }
    .spec-label { color: #94a3b8; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
    .spec-val { color: #38bdf8; font-weight: 600; margin-top: 2px; }

    /* Assemblies & Parts */
    .asm-title { font-size: 0.9rem; text-transform: uppercase; font-weight: 800; color: #cbd5e1; margin: 16px 0 8px 0; letter-spacing: 0.5px; }
    .part-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
    .part-name { font-size: 0.95rem; font-weight: 700; color: #f8fafc; }
    .part-nums { font-size: 0.8rem; color: #94a3b8; margin: 4px 0; }
    .part-nums strong { color: #38bdf8; }
    .part-fits { font-size: 0.75rem; color: #10b981; font-weight: 600; background: #064e3b; display: inline-block; padding: 2px 6px; border-radius: 4px; margin-bottom: 8px; }
    .buy-link { background: #22c55e; color: #0f172a; font-weight: 700; font-size: 0.75rem; text-decoration: none; padding: 6px 12px; border-radius: 4px; display: inline-flex; align-items: center; }

    /* Modal for Quick Blueprint Import */
    .import-btn { background: #475569; color: #f8fafc; border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    #import-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
    .modal-content { background: #1e293b; padding: 16px; border-radius: 10px; width: 100%; max-width: 480px; }
    textarea { width: 100%; height: 160px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #f8fafc; padding: 8px; font-family: monospace; font-size: 0.75rem; margin: 10px 0; }
  </style>
</head>
